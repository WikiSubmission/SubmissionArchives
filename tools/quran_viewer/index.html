<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Reader Pro</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="top-bar">
        <div class="logo">Quran Reader</div>

        <div class="nav-controls">
            <div class="control-group">
                <label>Chapter</label>
                <select id="chapterSelect"></select>
            </div>

            <div class="control-group">
                <label>View Mode</label>
                <div class="toggle-switch">
                    <button class="toggle-btn active" data-mode="triple">Comparison (3-Col)</button>
                    <button class="toggle-btn" data-mode="single">Reader (1-Col)</button>
                </div>
            </div>

            <div class="control-group" id="edition-selector-group" style="display: none;">
                <label>Edition</label>
                <select id="editionSelect">
                    <option value="text_ref">Reference (1992)</option>
                    <option value="text_1989">1989 Edition</option>
                    <option value="text_1981">1981 Edition</option>
                </select>
            </div>
        </div>

        <div class="nav-actions">
            <button id="prevBtn" class="nav-btn">←</button>
            <button id="nextBtn" class="nav-btn">→</button>
        </div>
    </nav>

    <main id="main-content" class="view-triple">
        <!-- Triple View Header -->
        <div class="comparison-header">
            <div class="col-head">1981 Edition</div>
            <div class="col-head">1989 Edition</div>
            <div class="col-head">Reference (1992)</div>
        </div>

        <!-- Content Container -->
        <div id="verses-container" class="content-area">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
