name: Repository verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first and alone so the repo-write token in this workflow is confined to a job
  # that never runs `npm ci` (and therefore never runs a third-party package's lifecycle
  # script) unless it genuinely needs to bootstrap missing baselines. On pull_request this
  # job is a no-op by design — checkout is skipped for forks anyway, and `needs:` below
  # still lets `verify` proceed once a skipped job reports success.
  prepare-visual-baselines:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate baselines
        run: VISUAL=1 npx playwright test tests/e2e/visual.spec.ts --update-snapshots

      - name: Commit and push baselines
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__snapshots__
          # Nothing staged is a legitimate no-op; a failing push is not, so it is not swallowed
          # — a swallowed failure here would leave visual assertions silently self-approving.
          if ! git diff --staged --quiet; then
            git commit -m "ci: commit Linux visual regression baselines"
            git push
          fi

  verify:
    needs: prepare-visual-baselines
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and content-contract tests
        run: npm test

      - name: Verify deterministic catalog generation
        run: npm run verify:catalog

      - name: Validate catalog source schemas
        run: npm run validate:catalog-schemas

      - name: Verify book thumbnails are committed
        run: npm run verify:thumbnails

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: npm run test:e2e
        env:
          VISUAL: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
