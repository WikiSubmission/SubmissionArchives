services:
  rag_postgres:
    image: pgvector/pgvector:pg16
    container_name: sa_rag_postgres
    ports:
      - '55433:5432'
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_only
      POSTGRES_DB: ask_the_archive
    volumes:
      - sa_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rag -d ask_the_archive']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sa_rag_pgdata:
    name: sa_rag_pgdata
