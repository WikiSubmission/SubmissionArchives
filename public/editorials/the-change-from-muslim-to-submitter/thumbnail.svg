    <text class="thumb-mono" x="0" y="22" font-size="10" fill="#A8A096" letter-spacing="0.8">DISSOLVING SECTARIAN MONOPOLIES · THE UNIVERSAL DEFINITION</text>
    <text class="thumb-mono" x="704" y="22" font-size="10" font-weight="700" fill="#D97738" letter-spacing="1.5" text-anchor="end">VIEW ↗</text>
