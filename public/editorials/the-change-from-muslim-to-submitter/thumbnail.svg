<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="thumb-submitter-title">
  <title id="thumb-submitter-title">The Change From 'Muslim' to 'Submitter'</title>
  <defs>
    <radialGradient id="bg-submitter" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241B14"/>
      <stop offset="60%" stop-color="#140F0B"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </radialGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA366"/>
      <stop offset="50%" stop-color="#D97738"/>
      <stop offset="100%" stop-color="#8C3814"/>
    </linearGradient>
    <filter id="glow-submitter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .thumb-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .thumb-serif { font-family: 'Source Serif Pro', Georgia, serif; }
      .thumb-sans { font-family: 'DM Sans', -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="600" fill="url(#bg-submitter)"/>
  <g opacity="0.1" stroke="#FAF5EE" stroke-width="0.5">
    <circle cx="400" cy="270" r="160" fill="none" stroke-dasharray="4 4"/>
    <line x1="400" y1="40" x2="400" y2="500"/>
    <line x1="180" y1="270" x2="620" y2="270"/>
  </g>
  <g stroke="#D97738" stroke-width="1.25" opacity="0.6">
    <path d="M 30 20 L 30 40 M 20 30 L 40 30"/>
    <path d="M 770 20 L 770 40 M 760 30 L 780 30"/>
    <path d="M 30 570 L 30 590 M 20 580 L 40 580"/>
    <path d="M 770 570 L 770 590 M 760 580 L 780 580"/>
  </g>
  <g transform="translate(400, 260)">
    <rect x="-180" y="-70" width="150" height="110" rx="4" fill="#140F0B" stroke="#FAF5EE" stroke-width="1.5" stroke-opacity="0.3"/>
    <text class="thumb-serif" x="-105" y="-20" font-size="28" font-weight="600" fill="#A8A096" text-anchor="middle">مُسْلِم</text>
    <text class="thumb-mono" x="-105" y="15" font-size="9" fill="#756D65" letter-spacing="1" text-anchor="middle">"MUSLIM"</text>
    <text class="thumb-mono" x="-105" y="28" font-size="7.5" fill="#E6652E" text-anchor="middle">Sectarian Label</text>

    <path d="M -10 -15 L 20 -15 M 10 -25 L 20 -15 L 10 -5" stroke="#FFA366" stroke-width="2.5" fill="none" filter="url(#glow-submitter)"/>

    <rect x="30" y="-70" width="160" height="110" rx="4" fill="#1E140C" stroke="#D97738" stroke-width="2" filter="url(#glow-submitter)"/>
    <text class="thumb-serif" x="110" y="-20" font-size="22" font-weight="700" fill="#FAF5EE" text-anchor="middle">Submitter</text>
    <text class="thumb-mono" x="110" y="15" font-size="9" font-weight="700" fill="#FFA366" letter-spacing="1" text-anchor="middle">UNIVERSAL TRUTH</text>
    <text class="thumb-mono" x="110" y="28" font-size="7.5" fill="#FAF5EE" text-anchor="middle">Abraham's Religion</text>

    <rect x="-90" y="70" width="180" height="24" rx="3" fill="#0A0705" stroke="#D97738" stroke-width="1"/>
    <text class="thumb-mono" x="0" y="86" font-size="8.5" font-weight="700" fill="#FFA366" letter-spacing="1" text-anchor="middle">QURAN 22:78 · MILLAT IBRAHIM</text>
  </g>
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="112" height="22" rx="3" fill="#D97738" fill-opacity="0.18" stroke="#D97738" stroke-opacity="0.5"/>
    <text class="thumb-mono" x="56" y="15" font-size="9" font-weight="700" fill="#D97738" letter-spacing="1.5" text-anchor="middle">MONOGRAPH 06</text>
    <text class="thumb-sans" x="0" y="42" font-size="11" font-weight="700" fill="#A8A096" letter-spacing="2.5">LINGUISTIC THEOLOGY</text>
  </g>
  <g transform="translate(48, 538)">
