<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="hero-submitter-title">
  <title id="hero-submitter-title">The Semantic Shift: From Tribal Identifier to Universal Quality</title>
  <defs>
    <radialGradient id="bg-submitter-hero" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241B14"/>
      <stop offset="60%" stop-color="#140F0B"/>
      <stop offset="100%" stop-color="#0A0705"/>
    </radialGradient>
    <filter id="glow-hero-submitter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .hero-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .hero-serif { font-family: 'Source Serif Pro', Georgia, serif; }
      .hero-sans { font-family: 'DM Sans', -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="url(#bg-submitter-hero)"/>
  <g opacity="0.1" stroke="#FAF5EE" stroke-width="0.75">
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="675" x2="1200" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
  </g>
  <g transform="translate(80, 80)">
    <text class="hero-mono" x="0" y="0" font-size="11" font-weight="700" fill="#D97738" letter-spacing="2">MONOGRAPH 06 · LINGUISTIC MIGRATION ANALYSIS</text>
    <text class="hero-serif" x="0" y="32" font-size="28" font-weight="600" fill="#FAF5EE">The Semantic Shift: Untranslated Sectarian Noun vs. Living Verb</text>
    <text class="hero-mono" x="0" y="56" font-size="12" fill="#A8A096">FROM PROPRIETARY HERITAGE (ISLAM / MUSLIM) TO UNIVERSAL DEVOTION (SUBMISSION / SUBMITTER)</text>
  </g>
  <g transform="translate(600, 480)">
    <rect x="-480" y="-180" width="420" height="340" rx="6" fill="#140F0B" stroke="#FAF5EE" stroke-width="1.25" stroke-opacity="0.3"/>
    <text class="hero-mono" x="-270" y="-150" font-size="11" font-weight="700" fill="#E6652E" text-anchor="middle" letter-spacing="1.5">PARADIGM A: PROPRIETARY MONOPOLY</text>
    <text class="hero-serif" x="-270" y="-95" font-size="34" font-weight="600" fill="#A8A096" text-anchor="middle">"Muslim" / "Islam"</text>
    <g fill="#756D65" font-size="12" class="hero-sans">
      <text x="-440" y="-40">• Treated as a proper name and exclusive club</text>
      <text x="-440" y="-15">• Excludes monotheists of Abraham, Moses, Jesus</text>
      <text x="-440" y="10">• Dependent on cultural rituals, hadith folklore</text>
      <text x="-440" y="35">• Divides humanity along ethnic/sectarian borders</text>
    </g>
    <rect x="-420" y="75" width="300" height="30" rx="3" fill="#241B14" stroke="#E6652E" stroke-width="1"/>
    <text class="hero-mono" x="-270" y="94" font-size="9.5" font-weight="700" fill="#FFA366" text-anchor="middle">Sectarian Identity Construct</text>

    <path d="M -40 -10 L 40 -10 M 25 -25 L 40 -10 L 25 5" stroke="#FFA366" stroke-width="3" fill="none" filter="url(#glow-hero-submitter)"/>

    <rect x="60" y="-180" width="420" height="340" rx="6" fill="#1E140C" stroke="#D97738" stroke-width="2" filter="url(#glow-hero-submitter)"/>
    <text class="hero-mono" x="270" y="-150" font-size="11" font-weight="700" fill="#FFA366" text-anchor="middle" letter-spacing="1.5">PARADIGM B: SCRIPTURAL DESCRIPTOR</text>
    <text class="hero-serif" x="270" y="-95" font-size="34" font-weight="700" fill="#FAF5EE" text-anchor="middle">"Submitter" / "Submission"</text>
    <g fill="#A8A096" font-size="12" class="hero-sans">
      <text x="100" y="-40">• Active spiritual description: one who submits to God</text>
      <text x="100" y="-15">• Abraham is the father of all Submitters (Q. 22:78)</text>
      <text x="100" y="10">• Unifies Jewish, Christian, and universal monotheists</text>
      <text x="100" y="35">• Root S-L-M translated into plain, direct English</text>
    </g>
    <rect x="120" y="75" width="300" height="30" rx="3" fill="#0A0705" stroke="#D97738" stroke-width="1.25"/>
    <text class="hero-mono" x="270" y="94" font-size="9.5" font-weight="700" fill="#FFA366" text-anchor="middle">Universal Scriptural Definition</text>
  </g>
  <g transform="translate(80, 840)">
    <text class="hero-mono" x="0" y="0" font-size="10.5" fill="#756D65">SUBMISSION ARCHIVES EDITORIAL SCHEMATICS · MONOGRAPH 06 · LINGUISTIC SPECIFICATION</text>
  </g>
</svg>
