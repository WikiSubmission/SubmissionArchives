    <text class="thumb-mono" x="0" y="22" font-size="10" fill="#A8A096" letter-spacing="0.8">RESOLVING THE FALSE DILEMMA · SCRIPTURAL SUPREMACY &amp; THE MESSENGER'S DUTY</text>
