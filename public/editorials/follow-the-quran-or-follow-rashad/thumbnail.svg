<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="thumb-follow-title">
  <title id="thumb-follow-title">Follow the Quran or Follow Rashad?</title>
  <defs>
    <radialGradient id="bg-follow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241914"/>
      <stop offset="60%" stop-color="#140E0A"/>
      <stop offset="100%" stop-color="#080504"/>
    </radialGradient>
    <linearGradient id="terracotta-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA366"/>
      <stop offset="50%" stop-color="#D97738"/>
      <stop offset="100%" stop-color="#8C3814"/>
    </linearGradient>
    <filter id="glow-follow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .thumb-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .thumb-serif { font-family: 'Source Serif Pro', Georgia, serif; }
      .thumb-sans { font-family: 'DM Sans', -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="600" fill="url(#bg-follow)"/>
  <g opacity="0.1" stroke="#FAF5EE" stroke-width="0.5">
    <circle cx="400" cy="270" r="160" fill="none" stroke-dasharray="4 4"/>
    <line x1="400" y1="40" x2="400" y2="500"/>
    <line x1="180" y1="270" x2="620" y2="270"/>
  </g>
  <g stroke="#D97738" stroke-width="1.25" opacity="0.6">
    <path d="M 30 20 L 30 40 M 20 30 L 40 30"/>
    <path d="M 770 20 L 770 40 M 760 30 L 780 30"/>
    <path d="M 30 570 L 30 590 M 20 580 L 40 580"/>
    <path d="M 770 570 L 770 590 M 760 580 L 780 580"/>
  </g>
  <g transform="translate(400, 260)">
