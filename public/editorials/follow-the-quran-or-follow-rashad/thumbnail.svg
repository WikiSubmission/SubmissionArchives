    <text class="thumb-mono" x="56" y="15" font-size="9" font-weight="700" fill="#FFA366" letter-spacing="1.5" text-anchor="middle">MONOGRAPH 10</text>
    <text class="thumb-sans" x="0" y="42" font-size="11" font-weight="700" fill="#A8A096" letter-spacing="2.5">CORE THEOLOGY</text>
  </g>
