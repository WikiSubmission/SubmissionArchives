<svg id="fig-hero-maher" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Maher Omar Amin and the Two False Verses</title>
  <desc id="hero-desc">An archival investigation into the historical addition of 9:128-129, the mathematical proof of their non-authentic status, manuscript evidence, and the testimony of Maher Omar Amin.</desc>

  <defs>
    
    <pattern id="maher-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#DCD3C4" stroke-width="0.75" opacity="0.65"/>
      <circle cx="0" cy="0" r="1" fill="#C4B9A7" opacity="0.8"/>
    </pattern>
    <pattern id="maher-subgrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 0 0 0 6" fill="none" stroke="#E3DBD0" stroke-width="0.35" opacity="0.5"/>
    </pattern>

    <filter id="maher-shadow" x="-5%" y="-5%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2D251E" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#2D251E" flood-opacity="0.06"/>
    </filter>

    <style>
      #fig-hero-maher text { font-family: 'DM Sans', var(--font-dm-sans), -apple-system, sans-serif; }
      #fig-hero-maher .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      #fig-hero-maher .card-bg { fill: #FAF7F2; stroke: #D8CEC0; stroke-width: 1.25; }
      #fig-hero-maher .sec-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #3D3732; text-transform: uppercase; }
      #fig-hero-maher .badge-txt { font-size: 8.5px; font-weight: 700; letter-spacing: 1px; fill: #FFFFFF; }
    </style>
  </defs>

  
  <rect width="1200" height="900" fill="#F4EFE6"/>
  <rect width="1200" height="900" fill="url(#maher-subgrid)"/>
  <rect width="1200" height="900" fill="url(#maher-grid)"/>

  
  <rect x="24" y="24" width="1152" height="852" fill="none" stroke="#CFC5B4" stroke-width="1.5"/>
  <rect x="28" y="28" width="1144" height="844" fill="none" stroke="#E5DDD0" stroke-width="1"/>

  <g transform="translate(44, 48)">
    <text class="mono" x="0" y="0" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#A85324">SUBMISSION ARCHIVES · SCRIPTURAL INTEGRITY RESEARCH</text>
    <text class="mono" x="0" y="14" font-size="9" letter-spacing="1" fill="#756D65">CASE STUDY: MAHER OMAR AMIN &amp; THE REMOVAL OF 9:128–129 · MATHEMATICAL &amp; HISTORICAL PROOF</text>
    <text class="mono" x="1112" y="0" font-size="9" letter-spacing="1.2" fill="#756D65" text-anchor="end">STATUS: VERIFIED RECOVERY</text>
    <line x1="0" y1="24" x2="1112" y2="24" stroke="#D5CCC0" stroke-width="1"/>
  </g>

  
  <g transform="translate(60, 96)">
    
    <rect class="card-bg" x="0" y="0" width="1080" height="330" rx="6" filter="url(#maher-shadow)"/>
    <rect x="0" y="0" width="1080" height="42" rx="6" fill="#EDE6DA" stroke="#D8CEC0" stroke-width="1"/>
    <rect x="18" y="10" width="28" height="22" rx="3" fill="#A85324"/>
    <text class="badge-txt" x="32" y="25" text-anchor="middle">01</text>
    <text class="sec-title" x="56" y="26">THE MATHEMATICAL IDENTIFICATION OF 9:128–129</text>
    <text class="mono" x="1060" y="26" font-size="9.5" fill="#756D65" text-anchor="end">CORPUS COMPARISON</text>

    
    <g transform="translate(30, 64)">
      
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="490" height="240" rx="4" fill="#FAF5EE" stroke="#A85324" stroke-width="1.25"/>
        <rect x="0" y="0" width="490" height="28" rx="4" fill="#F4EAE0"/>
        <text class="mono" x="14" y="18" font-size="9" font-weight="700" fill="#A85324">WITH 9:128–129 (INJECTED TRADITION)</text>
        <text class="mono" x="476" y="18" font-size="8.5" font-weight="700" fill="#A85324" text-anchor="end">ANOMALY</text>

        
        <g transform="translate(16, 42)">
          <text class="mono" x="0" y="14" font-size="9" fill="#756D65">Total Verses: <tspan font-weight="700" fill="#1C1A18">6,348</tspan> (6,346 + 2) <tspan fill="#A85324">≠ 19 × N (Remainder: 2)</tspan></text>
          <text class="mono" x="0" y="36" font-size="9" fill="#756D65">Word 'Allah' Count: <tspan font-weight="700" fill="#1C1A18">2,699</tspan> (2,698 + 1) <tspan fill="#A85324">≠ 19 × N (Remainder: 1)</tspan></text>
          <text class="mono" x="0" y="58" font-size="9" fill="#756D65">Verse Sum Total: <tspan font-weight="700" fill="#1C1A18">333,410</tspan> (333,153 + 257) <tspan fill="#A85324">≠ 19 × N</tspan></text>
          <text class="mono" x="0" y="80" font-size="9" fill="#756D65">Word 'Rasool' in 9:128: <tspan font-weight="700" fill="#A85324">Breaks Prophet Counts</tspan></text>
          <text class="mono" x="0" y="102" font-size="9" fill="#756D65">Title 'Ra'oof Raheem' applied to human: <tspan font-weight="700" fill="#A85324">Blasphemy</tspan></text>
          
          <rect x="0" y="120" width="458" height="40" rx="3" fill="#FFFFFF" stroke="#D5CCC0"/>
          <text class="mono" x="12" y="144" font-size="8.5" font-weight="700" fill="#A85324">RESULT: Complete collapse of mathematical symmetry.</text>
        </g>
      </g>

      
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="490" height="240" rx="4" fill="#FAF8F5" stroke="#CFC5B4" stroke-width="1.25"/>
        <rect x="0" y="0" width="490" height="28" rx="4" fill="#EDE4D6"/>
        <text class="mono" x="14" y="18" font-size="9" font-weight="700" fill="#3D3732">PURE QURANIC CORPUS (AUTHENTIC)</text>
        <text class="mono" x="476" y="18" font-size="8.5" font-weight="700" fill="#3D3732" text-anchor="end">19 × 334</text>

        
        <g transform="translate(16, 42)">
          <text class="mono" x="0" y="14" font-size="9" fill="#756D65">Total Verses: <tspan font-weight="700" fill="#1C1A18">6,346</tspan> <tspan font-weight="700" fill="#3D3732">= 19 × 334 (Exact)</tspan></text>
          <text class="mono" x="0" y="36" font-size="9" fill="#756D65">Word 'Allah' Count: <tspan font-weight="700" fill="#1C1A18">2,698</tspan> <tspan font-weight="700" fill="#3D3732">= 19 × 142 (Exact)</tspan></text>
          <text class="mono" x="0" y="58" font-size="9" fill="#756D65">Verse Sum Total: <tspan font-weight="700" fill="#1C1A18">333,153</tspan> <tspan font-weight="700" fill="#3D3732">= 19 × 17,534.36... (All factors match)</tspan></text>
          <text class="mono" x="0" y="80" font-size="9" fill="#756D65">God's Exclusive Names: <tspan font-weight="700" fill="#3D3732">Preserved strictly for God</tspan></text>
          <text class="mono" x="0" y="102" font-size="9" fill="#756D65">Surah 9 Structure: <tspan font-weight="700" fill="#3D3732">127 Verses (127 is Prime)</tspan></text>

          <rect x="0" y="120" width="458" height="40" rx="3" fill="#FFFFFF" stroke="#D5CCC0"/>
          <text class="mono" x="12" y="144" font-size="8.5" font-weight="700" fill="#3D3732">RESULT: Total interlocking mathematical perfection.</text>
        </g>
      </g>
    </g>

    
    
    <g transform="translate(0, 354)">
      <rect class="card-bg" x="0" y="0" width="526" height="350" rx="6" filter="url(#maher-shadow)"/>
      <rect x="0" y="0" width="526" height="42" rx="6" fill="#EDE6DA" stroke="#D8CEC0" stroke-width="1"/>
      <text class="sec-title" x="20" y="26">CLASSICAL ISLAMIC TESTIMONY (HADITH RECORD)</text>

      <g transform="translate(20, 60)">
        
        <rect x="0" y="0" width="486" height="76" rx="3" fill="#FFFFFF" stroke="#E5DDD0"/>
        <text class="mono" x="14" y="20" font-size="9" font-weight="700" fill="#A85324">SAHIH BUKHARI (VOL. 6, BOOK 60, #4988)</text>
        <text class="mono" x="14" y="36" font-size="8.5" fill="#3D3732">Zaid ibn Thabit: "I found the last two verses of Surah at-Tawbah</text>
        <text class="mono" x="14" y="50" font-size="8.5" fill="#3D3732">with Khuzaimah al-Ansari only, and with no one else."</text>
        <text class="mono" x="14" y="66" font-size="8" fill="#756D65">Rule of 2 Witnesses Violated · Single Source Inscription</text>

        
        <rect x="0" y="88" width="486" height="76" rx="3" fill="#FFFFFF" stroke="#E5DDD0"/>
        <text class="mono" x="14" y="108" font-size="9" font-weight="700" fill="#1C1A18">JALALUDDIN SUYUTI · AL-ITQAN FI 'ULUM AL-QUR'AN</text>
        <text class="mono" x="14" y="124" font-size="8.5" fill="#3D3732">Ubayy ibn Ka'b: "These two verses were written when the rest</text>
        <text class="mono" x="14" y="138" font-size="8.5" fill="#3D3732">of the Quran had already been assembled."</text>
        <text class="mono" x="14" y="154" font-size="8" fill="#756D65">Late Addition Confirmed in Classical Scholarship</text>

        
        <rect x="0" y="176" width="486" height="76" rx="3" fill="#FFFFFF" stroke="#E5DDD0"/>
        <text class="mono" x="14" y="196" font-size="9" font-weight="700" fill="#1C1A18">IBN ABI DAWUD · KITAB AL-MASAHIF (PP. 30–32)</text>
        <text class="mono" x="14" y="212" font-size="8.5" fill="#3D3732">Ali ibn Abi Talib and early Sahaba debated the inclusion of</text>
        <text class="mono" x="14" y="226" font-size="8.5" fill="#3D3732">unverified verses during Uthmanic standardization.</text>
        <text class="mono" x="14" y="242" font-size="8" fill="#756D65">Historical Dispute Documented in Classical Texts</text>
      </g>
    </g>

    
    <g transform="translate(554, 354)">
      <rect class="card-bg" x="0" y="0" width="526" height="350" rx="6" filter="url(#maher-shadow)"/>
      <rect x="0" y="0" width="526" height="42" rx="6" fill="#EDE6DA" stroke="#D8CEC0" stroke-width="1"/>
      <text class="sec-title" x="20" y="26">MAHER OMAR AMIN &amp; DR. KHALIFA'S DISCOVERY</text>

      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="486" height="86" rx="3" fill="#FFFFFF" stroke="#E5DDD0"/>
        <text class="mono" x="14" y="20" font-size="9" font-weight="700" fill="#A85324">MAHER OMAR AMIN (TUCSON / EGYPT RESEARCH)</text>
        <text class="mono" x="14" y="36" font-size="8.5" fill="#3D3732">Collaborator in Cairo and Tucson verification of early Quranic</text>
        <text class="mono" x="14" y="50" font-size="8.5" fill="#3D3732">manuscripts and letter counts during the March 1985 discovery.</text>
        <text class="mono" x="14" y="66" font-size="8" fill="#756D65">Documented in March 1985 issue of Submitters Perspective.</text>
        <text class="mono" x="14" y="78" font-size="8" fill="#A85324">Archival Record: Primary Audio Tape #229</text>

        
        <g transform="translate(0, 98)">
          <rect x="0" y="0" width="486" height="154" rx="3" fill="#FAF5EE" stroke="#A85324" stroke-width="1.25"/>
          <text class="mono" x="14" y="22" font-size="9" font-weight="700" fill="#A85324">QURAN 15:9 · DIVINE PRESERVATION PROMISE</text>
          <text class="mono" x="14" y="40" font-size="8.5" font-style="italic" fill="#1C1A18">"Absolutely, We have revealed the reminder, and absolutely,</text>
          <text class="mono" x="14" y="54" font-size="8.5" font-style="italic" fill="#1C1A18">We will preserve it." (15:9)</text>
          
          <line x1="14" y1="68" x2="472" y2="68" stroke="#E5DDD0" stroke-width="1"/>
          
          <text class="mono" x="14" y="86" font-size="8.5" fill="#575049">Preservation is not the absence of historical tamper attempts;</text>
          <text class="mono" x="14" y="100" font-size="8.5" fill="#575049">it is the built-in mathematical code that detects, isolates, and</text>
          <text class="mono" x="14" y="114" font-size="8.5" fill="#575049">expels any human addition with 100% mathematical certainty.</text>
          <text class="mono" x="14" y="136" font-size="8.5" font-weight="700" fill="#A85324">VERIFIED: 19-BASED SELF-PURIFYING MECHANISM</text>
        </g>
      </g>
    </g>
  </g>
</svg>
