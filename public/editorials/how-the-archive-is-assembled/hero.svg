<svg id="fig-hero" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The four stages</title>
  <desc id="hero-desc">The pipeline every item passes through: acquisition, where a source is logged with its origin; digitisation, where a preservation master is captured; transcription, where the text is set down and its method recorded; and indexing, where each segment is bound to its position in the source.</desc>

  <defs>
    <style>
      #fig-hero .num { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 500; letter-spacing: 2px; fill: #A85324; }
      #fig-hero .cap { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 25px; font-weight: 500; letter-spacing: 3.6px; fill: #6E6459; }
      #fig-hero .cell { fill: #EFE9DE; stroke: #C6B9A5; stroke-width: 2; }
      #fig-hero .ink { fill: #B3A897; }
      #fig-hero .line { stroke: #8C8175; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#E5DDD0"/>

  <!-- ================= 01 ACQUISITION ================= -->
  <g>
    <rect class="cell" x="70" y="80" width="510" height="350"/>
    <text class="num" x="100" y="130">01</text>
    <text class="cap" x="100" y="398">ACQUISITION</text>

    <!-- A shelved run of volumes; the accented one carries an accession tag. -->
    <g transform="translate(232 176)">
      <rect x="0"  y="24" width="34" height="128" fill="#D6C9B4" stroke="#A79B8B" stroke-width="2.5"/>
      <rect x="42" y="10" width="34" height="142" fill="#D6C9B4" stroke="#A79B8B" stroke-width="2.5"/>
      <rect x="84" y="20" width="40" height="132" fill="#FBF8F3" stroke="#A85324" stroke-width="3"/>
      <rect x="132" y="4"  width="34" height="148" fill="#D6C9B4" stroke="#A79B8B" stroke-width="2.5"/>
      <!-- Accession tag on the item being logged. -->
      <path d="M104 20 V-26 H150 L166 -10 V20" fill="#FBF8F3" stroke="#A85324" stroke-width="3"/>
      <rect x="116" y="-14" width="38" height="6" fill="#A85324"/>
      <rect x="116" y="0" width="26" height="6" fill="#C9A184"/>
    </g>
  </g>

  <!-- ================= 02 DIGITISATION ================= -->
  <g>
    <rect class="cell" x="620" y="80" width="510" height="350"/>
    <text class="num" x="650" y="130">02</text>
    <text class="cap" x="650" y="398">DIGITISATION</text>

    <!-- A sheet on the platen under a traversing capture bar. -->
    <g transform="translate(752 158)">
      <rect x="0" y="52" width="176" height="146" fill="#FBF8F3" stroke="#A79B8B" stroke-width="2.5"/>
      <g class="ink">
        <rect x="24" y="86" width="128" height="8"/>
        <rect x="24" y="108" width="106" height="8"/>
        <rect x="24" y="130" width="132" height="8"/>
        <rect x="24" y="152" width="76" height="8"/>
      </g>
      <!-- Capture bar and its light. -->
      <rect x="-16" y="18" width="208" height="16" fill="#A85324"/>
      <path d="M-16 34 L14 52 M40 34 L58 52 M96 34 L110 52 M152 34 L162 52 M192 34 L176 52"
            stroke="#A85324" stroke-width="2.5" opacity="0.5"/>
      <path d="M88 -14 V6" class="line" stroke="#A85324"/>
    </g>
  </g>

  <!-- ================= 03 TRANSCRIPTION ================= -->
  <g>
    <rect class="cell" x="70" y="470" width="510" height="350"/>
    <text class="num" x="100" y="520">03</text>
    <text class="cap" x="100" y="788">TRANSCRIPTION</text>

    <!-- The scan on the left, the checked transcript on the right. -->
    <g transform="translate(202 556)">
      <rect x="0" y="0" width="118" height="152" fill="#E8DFCF" stroke="#A79B8B" stroke-width="2.5"/>
      <g fill="#9A8F7E">
        <rect x="18" y="26" width="82" height="7"/>
        <rect x="18" y="46" width="66" height="7"/>
        <rect x="18" y="66" width="84" height="7"/>
        <rect x="18" y="86" width="48" height="7"/>
      </g>

      <path d="M136 76 H176" class="line" stroke="#A85324"/>
      <path d="M164 66 L176 76 L164 86" class="line" stroke="#A85324"/>

      <rect x="194" y="0" width="118" height="152" fill="#FBF8F3" stroke="#A85324" stroke-width="3"/>
      <g fill="#4A443C">
        <rect x="212" y="26" width="82" height="7"/>
        <rect x="212" y="46" width="66" height="7"/>
        <rect x="212" y="66" width="84" height="7"/>
        <rect x="212" y="86" width="30" height="7"/>
      </g>
      <rect x="248" y="84" width="3" height="11" fill="#A85324"/>
      <!-- Checked against the source. -->
      <path d="M212 118 L224 130 L248 106" class="line" stroke="#A85324"/>
    </g>
  </g>

  <!-- ================= 04 INDEXING ================= -->
  <g>
    <rect class="cell" x="620" y="470" width="510" height="350"/>
    <text class="num" x="650" y="520">04</text>
    <text class="cap" x="650" y="788">INDEXING</text>

    <!-- Segments bound to locators; one is found and pinned. -->
    <g transform="translate(742 556)">
      <rect x="0"  y="0"  width="196" height="34" fill="#E8DFCF" stroke="#A79B8B" stroke-width="2.5"/>
      <rect x="0"  y="44" width="196" height="34" fill="#FBF8F3" stroke="#A85324" stroke-width="3"/>
      <rect x="0"  y="88" width="196" height="34" fill="#E8DFCF" stroke="#A79B8B" stroke-width="2.5"/>

      <rect x="18" y="13" width="94" height="8" class="ink"/>
      <rect x="18" y="57" width="112" height="8" fill="#4A443C"/>
      <rect x="18" y="101" width="78" height="8" class="ink"/>

      <rect x="152" y="11" width="26" height="12" fill="#D6C9B4"/>
      <rect x="152" y="55" width="26" height="12" fill="#A85324"/>
      <rect x="152" y="99" width="26" height="12" fill="#D6C9B4"/>

      <!-- The query that landed on it. -->
      <circle cx="196" cy="61" r="30" fill="none" stroke="#A85324" stroke-width="4"/>
      <path d="M218 83 L242 107" stroke="#A85324" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
