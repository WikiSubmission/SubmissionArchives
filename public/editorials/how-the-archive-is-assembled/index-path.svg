<svg id="fig-index" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" role="img" aria-labelledby="index-title index-desc">
  <title id="index-title">The indexing path</title>
  <desc id="index-desc">A query resolves to a ranked list of segments; the chosen segment carries a locator, a page and paragraph for print or a timestamp for a recording; and that locator resolves to the scan or the moment in the recording that the result was drawn from.</desc>

  <defs>
    <style>
      #fig-index .lbl { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 500; letter-spacing: 2.6px; fill: #8C8175; }
      #fig-index .stage { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 500; letter-spacing: 3.4px; fill: #6E6459; }
      #fig-index .mono { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 500; letter-spacing: 1.2px; fill: #4A443C; }
      #fig-index .accent { font-family: 'DM Sans', Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 1.6px; fill: #A85324; }
      #fig-index .card { fill: #FBF8F3; stroke: #CFC4B2; stroke-width: 2; }
      #fig-index .flow { stroke: #A79B8B; stroke-width: 2; fill: none; marker-end: url(#tip); }
      #fig-index .flowA { stroke: #A85324; stroke-width: 2.5; fill: none; marker-end: url(#tipA); }
    </style>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A79B8B"/>
    </marker>
    <marker id="tipA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A85324"/>
    </marker>
  </defs>

  <rect width="1600" height="780" fill="#E5DDD0"/>

  <!-- ===== 1. QUERY ===== -->
  <g>
    <rect class="card" x="56" y="322" width="286" height="80" rx="4"/>
    <circle cx="96" cy="362" r="12" fill="none" stroke="#8C8175" stroke-width="2.5"/>
    <path d="M105 371 L118 384" stroke="#8C8175" stroke-width="2.5" stroke-linecap="round"/>
    <text class="mono" x="136" y="370">preservation master</text>
    <rect x="318" y="346" width="2" height="32" fill="#A85324"/>
  </g>
  <text class="stage" x="56" y="452">QUERY</text>

  <path class="flow" d="M352 362 H418"/>

  <!-- ===== 2. RANKED SEGMENTS ===== -->
  <g>
    <!-- Rank 1 -->
    <rect class="card" x="436" y="272" width="360" height="54" rx="3"/>
    <rect x="460" y="294" width="196" height="9" fill="#B3A897"/>
    <rect x="700" y="292" width="72" height="12" fill="#D6C9B4"/>
    <rect x="700" y="292" width="66" height="12" fill="#B3A897"/>

    <!-- Rank 2: the segment the reader opens -->
    <rect x="436" y="336" width="360" height="54" rx="3" fill="#FBF8F3" stroke="#A85324" stroke-width="2.5"/>
    <rect x="460" y="358" width="214" height="9" fill="#4A443C"/>
    <rect x="700" y="356" width="72" height="12" fill="#E6D5C2"/>
    <rect x="700" y="356" width="58" height="12" fill="#A85324"/>

    <!-- Rank 3 -->
    <rect class="card" x="436" y="400" width="360" height="54" rx="3"/>
    <rect x="460" y="422" width="158" height="9" fill="#B3A897"/>
    <rect x="700" y="420" width="72" height="12" fill="#D6C9B4"/>
    <rect x="700" y="420" width="34" height="12" fill="#B3A897"/>
  </g>
  <text class="stage" x="436" y="512">RANKED SEGMENTS</text>
  <text class="lbl" x="700" y="252" font-size="16" letter-spacing="2">RELEVANCE</text>

  <!-- Branch: the same segment resolves by page or by timestamp. -->
  <path class="flowA" d="M806 363 H846 Q866 363 866 343 V236 Q866 216 886 216 H926"/>
  <path class="flowA" d="M806 363 H846 Q866 363 866 383 V490 Q866 510 886 510 H926"/>

  <!-- ===== 3. SEGMENT LOCATOR ===== -->
  <g>
    <!-- Print -->
    <rect class="card" x="944" y="168" width="268" height="96" rx="4"/>
    <text class="lbl" x="968" y="204" font-size="16" letter-spacing="2.4">PRINT</text>
    <text class="accent" x="968" y="240">PAGE 214 · ¶ 3</text>

    <!-- Recording -->
    <rect class="card" x="944" y="462" width="268" height="96" rx="4"/>
    <text class="lbl" x="968" y="498" font-size="16" letter-spacing="2.4">AUDIO / VIDEO</text>
    <text class="accent" x="968" y="534">00:14:32 — 00:14:51</text>
  </g>
  <text class="stage" x="944" y="622">SEGMENT</text>

  <path class="flow" d="M1222 216 H1288"/>
  <path class="flow" d="M1222 510 H1288"/>

  <!-- ===== 4. EVIDENCE ===== -->
  <g>
    <!-- The scan itself, with the matched line struck in accent. -->
    <rect class="card" x="1306" y="96" width="236" height="240" rx="3"/>
    <g fill="#B3A897">
      <rect x="1334" y="130" width="180" height="8"/>
      <rect x="1334" y="156" width="160" height="8"/>
      <rect x="1334" y="208" width="180" height="8"/>
      <rect x="1334" y="234" width="140" height="8"/>
      <rect x="1334" y="260" width="176" height="8"/>
    </g>
    <rect x="1326" y="174" width="196" height="22" fill="#A85324" opacity="0.16"/>
    <rect x="1334" y="182" width="172" height="8" fill="#A85324"/>
    <text class="lbl" x="1334" y="312" font-size="16" letter-spacing="2">P. 214</text>

    <!-- The waveform, with the segment marked out. -->
    <rect class="card" x="1306" y="428" width="236" height="164" rx="3"/>
    <rect x="1380" y="440" width="64" height="140" fill="#A85324" opacity="0.14"/>
    <g fill="#B3A897">
      <rect x="1330" y="498" width="5" height="24"/><rect x="1341" y="486" width="5" height="48"/>
      <rect x="1352" y="492" width="5" height="36"/><rect x="1363" y="478" width="5" height="64"/>
      <rect x="1374" y="496" width="5" height="28"/>
    </g>
    <g fill="#A85324">
      <rect x="1385" y="470" width="5" height="80"/><rect x="1396" y="452" width="5" height="116"/>
      <rect x="1407" y="482" width="5" height="56"/><rect x="1418" y="462" width="5" height="96"/>
      <rect x="1429" y="490" width="5" height="40"/>
    </g>
    <g fill="#B3A897">
      <rect x="1445" y="484" width="5" height="52"/><rect x="1456" y="494" width="5" height="32"/>
      <rect x="1467" y="474" width="5" height="72"/><rect x="1478" y="490" width="5" height="40"/>
      <rect x="1489" y="500" width="5" height="20"/><rect x="1500" y="488" width="5" height="44"/>
      <rect x="1511" y="496" width="5" height="28"/>
    </g>
    <text class="lbl" x="1334" y="572" font-size="16" letter-spacing="2">00:14:32</text>
  </g>
  <text class="stage" x="1306" y="668">EVIDENCE</text>
</svg>
