<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="thumb-gaddafi-title">
  <title id="thumb-gaddafi-title">Gaddafi: The Downfall Marked by 19</title>

  <defs>
    <linearGradient id="bg-grad-gaddafi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191614"/>
      <stop offset="60%" stop-color="#110F0D"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>

    <linearGradient id="cracked-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B072"/>
      <stop offset="50%" stop-color="#B87333"/>
      <stop offset="100%" stop-color="#6B3310"/>
    </linearGradient>

    <filter id="glow-strike" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .thumb-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .thumb-serif { font-family: 'Source Serif Pro', Georgia, serif; }
      .thumb-sans { font-family: 'DM Sans', -apple-system, sans-serif; }
    </style>
  </defs>

  
  <rect width="800" height="600" fill="url(#bg-grad-gaddafi)"/>

  
  <g opacity="0.12" stroke="#FAF5EE" stroke-width="0.5">
    <circle cx="400" cy="270" r="180" fill="none"/>
    <circle cx="400" cy="270" r="120" fill="none" stroke-dasharray="3 3"/>
    <line x1="400" y1="50" x2="400" y2="490" stroke-dasharray="6 4"/>
    <line x1="180" y1="270" x2="620" y2="270" stroke-dasharray="6 4"/>
  </g>

  
  <g stroke="#D97738" stroke-width="1.25" opacity="0.6">
    <path d="M 30 20 L 30 40 M 20 30 L 40 30"/>
    <path d="M 770 20 L 770 40 M 760 30 L 780 30"/>
    <path d="M 30 570 L 30 590 M 20 580 L 40 580"/>
    <path d="M 770 570 L 770 590 M 760 580 L 780 580"/>
  </g>

  
  <g transform="translate(400, 270)">
    
    <path d="M -120 40 L -60 -70 L 0 -110 L 60 -70 L 120 40 L 40 60 L 0 40 L -40 60 Z" fill="none" stroke="url(#cracked-gold)" stroke-width="2.5" stroke-opacity="0.8"/>
    
    
    <path d="M -8 -130 L 4 -40 L -12 20 L 16 90 L -4 140" fill="none" stroke="#FFA366" stroke-width="3" filter="url(#glow-strike)"/>

    
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D97738" stroke-width="2" filter="url(#glow-strike)"/>
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#D97738" stroke-width="2"/>
    <line x1="0" y1="-45" x2="0" y2="45" stroke="#D97738" stroke-width="2"/>

    
    <g transform="translate(0, 100)">
      <rect x="-90" y="-12" width="180" height="24" rx="3" fill="#191614" stroke="#D97738" stroke-width="1.25"/>
      <text class="thumb-mono" x="0" y="4" font-size="9" font-weight="700" fill="#D97738" letter-spacing="1.5" text-anchor="middle">OCT 20, 2011 · SIRTE</text>
    </g>
  </g>

  
  <g transform="translate(48, 58)">
    <rect x="0" y="0" width="105" height="22" rx="3" fill="#D97738" fill-opacity="0.15" stroke="#D97738" stroke-opacity="0.4"/>
    <text class="thumb-mono" x="52" y="15" font-size="9" font-weight="700" fill="#D97738" letter-spacing="1.5" text-anchor="middle">MONOGRAPH 04</text>
    <text class="thumb-sans" x="0" y="44" font-size="11" font-weight="600" fill="#A8A096" letter-spacing="2">DIVINE RECKONING</text>
  </g>

  
  <g transform="translate(48, 532)">
    <text class="thumb-serif" x="0" y="0" font-size="24" font-weight="600" fill="#FAF5EE" letter-spacing="-0.5">Gaddafi: The Downfall Marked by 19</text>
    <text class="thumb-mono" x="0" y="24" font-size="10.5" fill="#A8A096" letter-spacing="1">42-YEAR RULE · THE PHARAOH PARADIGM · SCRIPTURAL RETRIBUTION</text>
    <text class="thumb-mono" x="704" y="24" font-size="10.5" font-weight="700" fill="#D97738" letter-spacing="1.5" text-anchor="end">VIEW ↗</text>
  </g>
